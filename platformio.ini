; ============================================================================
;  LoRa Water Pump Control  -  Configuracao do projeto PlatformIO
; ----------------------------------------------------------------------------
;  Dois ambientes de build compartilham o mesmo codigo em lib/:
;    - reservoir_node : lado da caixa d'agua, sensor de nivel + transmissor
;    - pump_node      : lado da bomba, rele/contator + receptor/atuador
;
;  Escolha qual no compilar/gravar com a flag -e, por exemplo:
;    pio run -e reservoir_node -t upload
;    pio run -e pump_node      -t upload -t monitor
; ============================================================================

[platformio]
default_envs = reservoir_node, pump_node

; ---- Configuracoes compartilhadas por todos os ambientes ------------------
[env]
platform      = espressif32
board         = esp32-c3-devkitm-1        ; TODO(hw): confirmar a placa ESP32-C3 exata
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800

; Resolucao de bibliotecas: as camadas em lib/ (config, hal, protocol, core,
; power) se referenciam por caminho ("hal/E220Radio.h"), entao a raiz lib/
; precisa estar no include path e o LDF precisa varrer as dependencias.
lib_ldf_mode = deep+

; Verbosidade do log do firmware (0=nenhum .. 5=verboso). Sobrescrevivel por env.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I ${PROJECT_DIR}/lib
    -D CORE_DEBUG_LEVEL=3

build_unflags =
    -std=gnu++11

; Dependencias de terceiros. Mantidas ao minimo de proposito; o driver do E220
; e escrito a mao seguindo o datasheet, entao nao ficamos presos a API de lib.
lib_deps =
    ; Monitor de bateria INA219/INA226 (linkado apenas onde for usado)
    ; wollewald/INA226_WE @ ^1.2.9        ; TODO(hw): habilitar apos confirmar HW

; ---------------------------------------------------------------------------
;  No do reservatorio (caixa d'agua)  -  transmissor
; ---------------------------------------------------------------------------
[env:reservoir_node]
build_src_filter = +<reservoir_node/> -<pump_node/>
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_RESERVOIR=1
    ; Sensor de nivel: BOIA e o padrao. Descomente para usar o ultrassonico
    ; (opcional) no lugar das boias.
    ; -D USE_ULTRASONIC_SENSOR=1

; ---------------------------------------------------------------------------
;  No da captacao (bomba)  -  receptor / atuador
; ---------------------------------------------------------------------------
[env:pump_node]
build_src_filter = +<pump_node/> -<reservoir_node/>
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_PUMP=1
